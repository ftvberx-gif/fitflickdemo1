<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FITFLICK | Admin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6f8;
            color: #111;
        }

        /* LOGIN */

        #loginPage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #111, #e63946);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .login-box h1 span {
            color: #e63946;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 17px;
            font-size: 15px;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #e63946;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #c92535;
        }

        #loginError {
            color: #e63946;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        /* ADMIN */

        #adminPage {
            display: none;
        }

        header {
            height: 75px;
            background: white;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .logo img {
            width: 135px;
        }

        .logout {
            border: none;
            background: #111;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
        }

        .logout:hover {
            background: #e63946;
        }

        .admin-title {
            padding: 45px 6%;
            background: linear-gradient(120deg, #fff1f3, #f3f4ff);
        }

        .admin-title h1 {
            font-size: 38px;
        }

        .admin-title span {
            color: #e63946;
        }

        .admin-title p {
            color: #666;
            margin-top: 8px;
        }

        .dashboard {
            width: 88%;
            max-width: 1300px;
            margin: 35px auto 70px;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        }

        .stat h3 {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat strong {
            font-size: 28px;
        }

        /* ADD PRODUCT */

        .panel {
            background: white;
            padding: 28px;
            border-radius: 18px;
            margin-bottom: 30px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        }

        .panel h2 {
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0 20px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .add-button {
            border: none;
            background: #111;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-button:hover {
            background: #e63946;
        }

        /* PRODUCTS */

        .product-table {
            width: 100%;
            border-collapse: collapse;
        }

        .product-table th,
        .product-table td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .product-table th {
            background: #f7f7f7;
        }

        .product-image {
            width: 55px;
            height: 65px;
            object-fit: cover;
            border-radius: 7px;
        }

        .edit-button {
            background: #111;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-button {
            background: #ffe5e8;
            color: #e63946;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 5px;
        }

        /* OFFER */

        .offer-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .save-offer {
            background: #e63946;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 30px;
        }

        footer p {
            color: #999;
            margin-top: 8px;
        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid,
            .offer-box {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .product-table {
                font-size: 12px;
            }

            .product-table th:nth-child(3),
            .product-table td:nth-child(3) {
                display: none;
            }
        }
    </style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<section id="loginPage">

    <div class="login-box">

        <h1>
            FIT<span>FLICK</span>
        </h1>

        <p>
            Admin Dashboard
        </p>


        <label>
            Admin Username
        </label>

        <input
            type="text"
            id="adminUsername"
            placeholder="Enter username">


        <label>
            Admin Password
        </label>

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter password">


        <button
            class="login-button"
            onclick="adminLogin()">

            Login

        </button>


        <div id="loginError"></div>

    </div>

</section>



<!-- ================= ADMIN PAGE ================= -->

<section id="adminPage">

    <header>

        <a href="index.html">
            <img
                src="images/logo.png"
                class="logo"
                alt="FITFLICK Logo">
        </a>

        <button
            class="logout"
            onclick="logout()">

            Logout

        </button>

    </header>


    <section class="admin-title">

        <h1>
            FITFLICK <span>Admin Panel</span>
        </h1>

        <p>
            Manage your products, prices and offers.
        </p>

    </section>


    <main class="dashboard">


        <!-- STATS -->

        <div class="stats">

            <div class="stat">

                <h3>
                    TOTAL PRODUCTS
                </h3>

                <strong id="productCount">
                    0
                </strong>

            </div>


            <div class="stat">

                <h3>
                    CART ORDERS
                </h3>

                <strong id="orderCount">
                    0
                </strong>

            </div>


            <div class="stat">

                <h3>
                    CURRENT OFFER
                </h3>

                <strong id="offerDisplay">
                    None
                </strong>

            </div>

        </div>



        <!-- ADD PRODUCT -->

        <div class="panel">

            <h2>
                ➕ Add New Product
            </h2>


            <div class="form-grid">

                <div>

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Example: Premium Shirt">

                </div>


                <div>

                    <label>
                        Category
                    </label>

                    <select id="productCategory">

                        <option value="Shirts">
                            Shirts
                        </option>

                        <option value="Jackets">
                            Jackets
                        </option>

                        <option value="Pants">
                            Pants
                        </option>

                    </select>

                </div>


                <div>

                    <label>
                        Price (₹)
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        placeholder="999">

                </div>


                <div>

                    <label>
                        Offer Price (₹)
                    </label>

                    <input
                        type="number"
                        id="offerPrice"
                        placeholder="799">

                </div>


                <div class="full">

                    <label>
                        Image File Name
                    </label>

                    <input
                        type="text"
                        id="productImage"
                        placeholder="images/shirts/shirt1.jpg">

                </div>

            </div>


            <button
                class="add-button"
                onclick="addProduct()">

                Add Product

            </button>

        </div>



        <!-- PRODUCTS -->

        <div class="panel">

            <h2>
                📦 Products
            </h2>


            <div style="overflow-x:auto;">

                <table class="product-table">

                    <thead>

                        <tr>

                            <th>
                                Image
                            </th>

                            <th>
                                Product
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                Price
                            </th>

                            <th>
                                Offer
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="productList">

                    </tbody>

                </table>

            </div>

        </div>



        <!-- OFFERS -->

        <div class="panel">

            <h2>
                🏷️ Website Offer
            </h2>


            <div class="offer-box">

                <div>

                    <label>
                        Offer Text
                    </label>

                    <input
                        type="text"
                        id="offerText"
                        placeholder="Example: 20% OFF">

                </div>


                <div>

                    <label>
                        Offer Code
                    </label>

                    <input
                        type="text"
                        id="offerCode"
                        placeholder="FIT20">

                </div>

            </div>


            <button
                class="save-offer"
                onclick="saveOffer()">

                Save Offer

            </button>

        </div>

    </main>


    <footer>

        <h3>
            FITFLICK
        </h3>

        <p>
            Admin Dashboard
        </p>

        <p>
            © 2026 FITFLICK
        </p>

    </footer>

</section>



<script>

/* ================= LOGIN ================= */

/*
 * DEMO FRONT-END LOGIN ONLY.
 *
 * Do NOT use these credentials for a real
 * production store. We will replace this
 * with secure backend authentication.
 */

const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "fitflick123";


function adminLogin() {

    const username =
        document.getElementById("adminUsername").value;

    const password =
        document.getElementById("adminPassword").value;


    if (
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ) {

        sessionStorage.setItem(
            "fitflickAdmin",
            "true"
        );

        showAdmin();

    } else {

        document.getElementById("loginError")
            .textContent =
            "Incorrect username or password.";

    }

}


/* SHOW ADMIN */

function showAdmin() {

    document.getElementById("loginPage")
        .style.display = "none";

    document.getElementById("adminPage")
        .style.display = "block";

    loadProducts();

    loadOffer();

    updateStats();

}


/* LOGOUT */

function logout() {

    sessionStorage.removeItem(
        "fitflickAdmin"
    );

    location.reload();

}


/* ================= PRODUCTS ================= */

let products =
    JSON.parse(
        localStorage.getItem("fitflickProducts")
    ) || [];


function addProduct() {

    const name =
        document.getElementById("productName")
            .value.trim();

    const category =
        document.getElementById("productCategory")
            .value;

    const price =
        Number(
            document.getElementById("productPrice")
                .value
        );

    const offerPrice =
        Number(
            document.getElementById("offerPrice")
                .value
        );

    const image =
        document.getElementById("productImage")
            .value.trim();


    if (
        !name ||
        !price ||
        !image
    ) {

        alert(
            "Please enter product name, price and image."
        );

        return;
    }


    const product = {

        id: Date.now(),

        name: name,

        category: category,

        price: price,

        offerPrice:
            offerPrice || null,

        image: image

    };


    products.push(product);


    localStorage.setItem(
        "fitflickProducts",
        JSON.stringify(products)
    );


    alert(
        "Product added successfully!"
    );


    document.getElementById("productName")
        .value = "";

    document.getElementById("productPrice")
        .value = "";

    document.getElementById("offerPrice")
        .value = "";

    document.getElementById("productImage")
        .value = "";


    loadProducts();

    updateStats();

}


/* LOAD PRODUCTS */

function loadProducts() {

    const list =
        document.getElementById("productList");


    list.innerHTML = "";


    if (products.length === 0) {

        list.innerHTML = `

            <tr>

                <td colspan="6"
                    style="text-align:center;padding:30px;">

                    No products added yet.

                </td>

            </tr>

        `;

        return;
    }


    products.forEach(function(product) {

        list.innerHTML += `

            <tr>

                <td>

                    <img
                        src="${product.image}"
                        class="product-image"
                        alt="${product.name}">

                </td>


                <td>
                    ${product.name}
                </td>


                <td>
                    ${product.category}
                </td>


                <td>
                    ₹${product.price}
                </td>


                <td>

                    ${
                        product.offerPrice
                        ? "₹" + product.offerPrice
                        : "—"
                    }

                </td>


                <td>

                    <button
                        class="edit-button"
                        onclick="editProduct(${product.id})">

                        Edit

                    </button>


                    <button
                        class="delete-button"
                        onclick="deleteProduct(${product.id})">

                        Delete

                    </button>

                </td>

            </tr>

        `;

    });

}


/* EDIT PRODUCT */

function editProduct(id) {

    const product =
        products.find(
            p => p.id === id
        );


    if (!product) return;


    const newPrice =
        prompt(
            "Enter new price:",
            product.price
        );


    if (newPrice === null) return;


    const newOffer =
        prompt(
            "Enter new offer price (leave blank for no offer):",
            product.offerPrice || ""
        );


    product.price =
        Number(newPrice);


    product.offerPrice =
        newOffer
        ? Number(newOffer)
        : null;


    localStorage.setItem(
        "fitflickProducts",
        JSON.stringify(products)
    );


    loadProducts();

}


/* DELETE PRODUCT */

function deleteProduct(id) {

    if (
        !confirm(
            "Delete this product?"
        )
    ) {

        return;
    }


    products =
        products.filter(
            p => p.id !== id
        );


    localStorage.setItem(
        "fitflickProducts",
        JSON.stringify(products)
    );


    loadProducts();

    updateStats();

}


/* ================= OFFERS ================= */

function saveOffer() {

    const text =
        document.getElementById("offerText")
            .value.trim();

    const code =
        document.getElementById("offerCode")
            .value.trim();


    if (!text) {

        alert(
            "Enter an offer first."
        );

        return;
    }


    const offer = {

        text: text,

        code: code

    };


    localStorage.setItem(
        "fitflickOffer",
        JSON.stringify(offer)
    );


    alert(
        "Offer saved successfully!"
    );


    loadOffer();

}


/* LOAD OFFER */

function loadOffer() {

    const offer =
        JSON.parse(
            localStorage.getItem("fitflickOffer")
        );


    if (!offer) {

        document.getElementById("offerDisplay")
            .textContent = "None";

        return;
    }


    document.getElementById("offerDisplay")
        .textContent = offer.text;

}


/* ================= STATS ================= */

function updateStats() {

    document.getElementById("productCount")
        .textContent = products.length;


    const cart =
        JSON.parse(
            localStorage.getItem("fitflickCart")
        ) || [];


    document.getElementById("orderCount")
        .textContent = cart.length;

}


/* ================= START ================= */

if (
    sessionStorage.getItem("fitflickAdmin")
    === "true"
) {

    showAdmin();

}

</script>

</body>
</html>
