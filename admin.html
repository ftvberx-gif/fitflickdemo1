<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FITFLICK | Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #111;
        }

        /* LOGIN */

        #loginPage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #111, #e63946);
        }

        .login-box {
            width: 360px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        .login-box button {
            width: 100%;
            padding: 13px;
            border: none;
            background: #111;
            color: white;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #e63946;
        }

        #loginError {
            color: #e63946;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        /* ADMIN */

        #adminPage {
            display: none;
        }

        header {
            height: 70px;
            background: #111;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
        }

        .brand {
            font-size: 25px;
            font-weight: bold;
        }

        .brand span {
            color: #e63946;
        }

        .logout {
            background: #e63946;
            border: none;
            color: white;
            padding: 9px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 1300px;
            margin: 30px auto;
        }

        /* DASHBOARD CARDS */

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .card h3 {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card strong {
            font-size: 30px;
        }

        /* SECTIONS */

        .section {
            background: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        /* ADD PRODUCT */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        .add-btn {
            margin-top: 18px;
            padding: 12px 22px;
            background: #111;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #e63946;
        }

        /* TABLE */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #111;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #eee;
        }

        .status {
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            background: #eee;
        }

        .status-select {
            padding: 7px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .delete-btn {
            background: #e63946;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* PRODUCTS */

        .product-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .product-item {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
        }

        .product-item h3 {
            margin-bottom: 7px;
        }

        .product-item p {
            color: #666;
            margin-bottom: 5px;
        }

        /* OFFER */

        .offer-box {
            display: flex;
            gap: 10px;
        }

        .offer-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        /* MOBILE */

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .product-list {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {

            header {
                padding: 0 4%;
            }

            .container {
                width: 94%;
            }

            .cards {
                grid-template-columns: 1fr 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .product-list {
                grid-template-columns: 1fr;
            }

            .offer-box {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginPage">

    <div class="login-box">

        <h1>FIT<span style="color:#e63946;">FLICK</span></h1>

        <p>Admin Dashboard</p>

        <input
            type="text"
            id="username"
            placeholder="Username">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button onclick="login()">
            Login
        </button>

        <div id="loginError">
            Wrong username or password
        </div>

    </div>

</div>


<!-- ================= ADMIN PAGE ================= -->

<div id="adminPage">

    <header>

        <div class="brand">
            FIT<span>FLICK</span> ADMIN
        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </header>


    <div class="container">


        <!-- DASHBOARD -->

        <div class="cards">

            <div class="card">

                <h3>Total Orders</h3>

                <strong id="totalOrders">
                    0
                </strong>

            </div>


            <div class="card">

                <h3>Paid Orders</h3>

                <strong id="paidOrders">
                    0
                </strong>

            </div>


            <div class="card">

                <h3>Total Products</h3>

                <strong id="totalProducts">
                    0
                </strong>

            </div>


            <div class="card">

                <h3>Total Sales</h3>

                <strong>
                    ₹<span id="totalSales">0</span>
                </strong>

            </div>

        </div>


        <!-- ================= ORDERS ================= -->

        <div class="section">

            <h2>📦 Customer Orders</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Product</th>
                            <th>Total</th>
                            <th>Payment</th>
                            <th>Status</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="ordersTable">

                    </tbody>

                </table>

            </div>

        </div>


        <!-- ================= ADD PRODUCT ================= -->

        <div class="section">

            <h2>➕ Add New Product</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Product Name</label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Example: Levi's Pants">

                </div>


                <div class="form-group">

                    <label>Category</label>

                    <select id="productCategory">

                        <option value="Shirts">
                            Shirts
                        </option>

                        <option value="Jackets">
                            Jackets
                        </option>

                        <option value="Pants">
                            Pants
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Price</label>

                    <input
                        type="number"
                        id="productPrice"
                        placeholder="1999">

                </div>


                <div class="form-group">

                    <label>Offer</label>

                    <input
                        type="text"
                        id="productOffer"
                        placeholder="20% OFF">

                </div>

            </div>

            <button
                class="add-btn"
                onclick="addProduct()">

                Add Product

            </button>

        </div>


        <!-- ================= PRODUCTS ================= -->

        <div class="section">

            <h2>👕 Products</h2>

            <div
                class="product-list"
                id="productList">

            </div>

        </div>


        <!-- ================= OFFERS ================= -->

        <div class="section">

            <h2>🏷️ Update Store Offer</h2>

            <div class="offer-box">

                <input
                    type="text"
                    id="storeOffer"
                    placeholder="Example: 30% OFF">

                <button
                    class="add-btn"
                    onclick="saveOffer()">

                    Save Offer

                </button>

            </div>

            <p
                id="currentOffer"
                style="margin-top:15px;color:#666;">

            </p>

        </div>


    </div>

</div>


<script>

    /* ================= LOGIN ================= */

    function login() {

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;


        /*
            DEMO LOGIN

            Username: admin
            Password: fitflick123
        */

        if (
            username === "admin" &&
            password === "fitflick123"
        ) {

            document.getElementById("loginPage")
                .style.display = "none";

            document.getElementById("adminPage")
                .style.display = "block";

            loadDashboard();

        } else {

            document.getElementById("loginError")
                .style.display = "block";

        }

    }


    /* ================= LOGOUT ================= */

    function logout() {

        document.getElementById("adminPage")
            .style.display = "none";

        document.getElementById("loginPage")
            .style.display = "flex";

    }


    /* ================= ORDERS ================= */

    function getOrders() {

        return JSON.parse(
            localStorage.getItem("fitflickOrders")
        ) || [];

    }


    function loadOrders() {

        const orders =
            getOrders();

        const table =
            document.getElementById("ordersTable");

        table.innerHTML = "";


        if (orders.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="8"
                        style="text-align:center;padding:30px;">
                        No orders yet
                    </td>
                </tr>
            `;

            return;

        }


        orders.forEach((order, index) => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${order.orderId || "FF-" + (index + 1)}
                </td>

                <td>
                    ${order.customer?.name || "Unknown"}
                </td>

                <td>
                    ${order.customer?.phone || "-"}
                </td>

                <td>
                    ${order.product || "Multiple items"}
                </td>

                <td>
                    ₹${order.total || 0}
                </td>

                <td>
                    <span class="status">
                        ${order.payment || "Pending"}
                    </span>
                </td>

                <td>

                    <select
                        class="status-select"
                        onchange="updateStatus(${index}, this.value)">

                        <option
                            ${order.status === "Order Placed" ? "selected" : ""}>
                            Order Placed
                        </option>

                        <option
                            ${order.status === "Paid" ? "selected" : ""}>
                            Paid
                        </option>

                        <option
                            ${order.status === "Preparing" ? "selected" : ""}>
                            Preparing
                        </option>

                        <option
                            ${order.status === "Packed" ? "selected" : ""}>
                            Packed
                        </option>

                        <option
                            ${order.status === "Shipped" ? "selected" : ""}>
                            Shipped
                        </option>

                        <option
                            ${order.status === "Out for Delivery" ? "selected" : ""}>
                            Out for Delivery
                        </option>

                        <option
                            ${order.status === "Delivered" ? "selected" : ""}>
                            Delivered
                        </option>

                        <option
                            ${order.status === "Cancelled" ? "selected" : ""}>
                            Cancelled
                        </option>

                    </select>

                </td>

                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteOrder(${index})">

                        Delete

                    </button>

                </td>

            `;

            table.appendChild(row);

        });

    }


    function updateStatus(index, status) {

        const orders =
            getOrders();

        orders[index].status =
            status;

        localStorage.setItem(
            "fitflickOrders",
            JSON.stringify(orders)
        );

        loadDashboard();

        alert(
            "Order status updated to: " +
            status
        );

    }


    function deleteOrder(index) {

        if (
            !confirm(
                "Delete this order?"
            )
        ) {
            return;
        }

        const orders =
            getOrders();

        orders.splice(index, 1);

        localStorage.setItem(
            "fitflickOrders",
            JSON.stringify(orders)
        );

        loadDashboard();

    }


    /* ================= PRODUCTS ================= */

    function getProducts() {

        return JSON.parse(
            localStorage.getItem("fitflickProducts")
        ) || [];

    }


    function addProduct() {

        const name =
            document.getElementById("productName").value;

        const category =
            document.getElementById("productCategory").value;

        const price =
            document.getElementById("productPrice").value;

        const offer =
            document.getElementById("productOffer").value;


        if (
            name === "" ||
            price === ""
        ) {

            alert(
                "Please enter product name and price."
            );

            return;

        }


        const products =
            getProducts();


        products.push({

            name: name,

            category: category,

            price: Number(price),

            offer: offer

        });


        localStorage.setItem(
            "fitflickProducts",
            JSON.stringify(products)
        );


        document.getElementById("productName").value = "";
        document.getElementById("productPrice").value = "";
        document.getElementById("productOffer").value = "";


        loadDashboard();

        alert(
            "Product added successfully!"
        );

    }


    function loadProducts() {

        const products =
            getProducts();

        const list =
            document.getElementById("productList");

        list.innerHTML = "";


        if (products.length === 0) {

            list.innerHTML =
                "<p>No products added yet.</p>";

            return;

        }


        products.forEach((product, index) => {

            list.innerHTML += `

                <div class="product-item">

                    <h3>
                        ${product.name}
                    </h3>

                    <p>
                        Category: ${product.category}
                    </p>

                    <p>
                        Price: ₹${product.price}
                    </p>

                    <p>
                        Offer: ${product.offer || "No offer"}
                    </p>

                    <button
                        class="delete-btn"
                        onclick="deleteProduct(${index})">

                        Delete

                    </button>

                </div>

            `;

        });

    }


    function deleteProduct(index) {

        if (
            !confirm(
                "Delete this product?"
            )
        ) {
            return;
        }


        const products =
            getProducts();

        products.splice(index, 1);


        localStorage.setItem(
            "fitflickProducts",
            JSON.stringify(products)
        );


        loadDashboard();

    }


    /* ================= OFFERS ================= */

    function saveOffer() {

        const offer =
            document.getElementById("storeOffer").value;


        if (offer === "") {

            alert(
                "Enter an offer first."
            );

            return;

        }


        localStorage.setItem(
            "fitflickOffer",
            offer
        );


        showOffer();

        alert(
            "Store offer updated!"
        );

    }


    function showOffer() {

        const offer =
            localStorage.getItem(
                "fitflickOffer"
            );


        document.getElementById(
            "currentOffer"
        ).textContent =
            offer
            ? "Current Offer: " + offer
            : "No offer currently active.";

    }


    /* ================= DASHBOARD ================= */

    function loadDashboard() {

        const orders =
            getOrders();

        const products =
            getProducts();


        document.getElementById(
            "totalOrders"
        ).textContent =
            orders.length;


        const paid =
            orders.filter(
                order =>
                    order.payment === "Paid"
            ).length;


        document.getElementById(
            "paidOrders"
        ).textContent =
            paid;


        document.getElementById(
            "totalProducts"
        ).textContent =
            products.length;


        let sales = 0;


        orders.forEach(order => {

            if (
                order.payment === "Paid"
            ) {

                sales +=
                    Number(order.total) || 0;

            }

        });


        document.getElementById(
            "totalSales"
        ).textContent =
            sales;


        loadOrders();

        loadProducts();

        showOffer();

    }

</script>

</body>
</html>
